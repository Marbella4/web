<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#18cfe6" />
  <meta name="description" content="Web oficial de Marbella 4 Roleplay" />
  <title>Marbella 4 Roleplay</title>
  <link rel="icon" href="./assets/images/m4rbella_logo.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="site-root">
  <div class="site-background"></div>
  <div class="site-overlay"></div>

  <header class="top-chrome">
    <button class="brand-button js-tab" data-tab="inicio" aria-label="Inicio">
      <img src="./assets/images/m4rbella_logo.png" alt="Marbella 4 Roleplay" />
    </button>
    <nav class="tabs-bar" aria-label="Navegación principal">
      <button class="top-tab active" data-tab="inicio">INICIO</button>
      <button class="top-tab" data-tab="servidor">EL SERVIDOR</button>
      <button class="top-tab" data-tab="trabajos">TRABAJOS</button>
      <button class="top-tab" data-tab="facciones">FACCIONES</button>
      <button class="top-tab" data-tab="ilegal">ILEGAL</button>
      <button class="top-tab" data-tab="normativa">NORMATIVA</button>
      <button class="top-tab" data-tab="acceso">ACCESO</button>
    </nav>
    <button id="soundSwitch" class="sound-switch on" type="button">🔊 SONIDO</button>
  </header>

  <main class="app-shell">
    <section id="page-inicio" class="page page-active"></section>
    <section id="page-servidor" class="page"></section>
    <section id="page-trabajos" class="page"></section>
    <section id="page-facciones" class="page"></section>
    <section id="page-ilegal" class="page"></section>
    <section id="page-normativa" class="page"></section>
    <section id="page-acceso" class="page"></section>
  </main>

  <footer class="site-footer">
    <img src="./assets/images/m4rbella_logo.png" alt="Marbella 4" />
    <span>MARBELLA 4 ROLEPLAY · WEB OFICIAL</span>
    <button class="footer-top" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})">VOLVER ARRIBA ↑</button>
  </footer>
</div>
<script src="./app.js"></script>
</body>
</html>
